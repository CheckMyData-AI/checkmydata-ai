name: CI

on:
  push:
    # Scoped on purpose: the pull_request trigger below already covers branch work,
    # and a full suite on every push to every branch buys nothing.
    branches: [main]
  pull_request:
    # Deliberately UNfiltered by base branch. `branches: [main]` here meant a stacked
    # PR — one whose base is another feature branch — ran no checks at all, and its
    # page showed no red because nothing had run. PR #218 shipped three raw git
    # conflict markers that way, over a lifetime of zero CI runs.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # Mirror production layout: keep heavy ML caches outside the repo so
      # actions/cache can persist them across runs (T36).
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: ${{ github.workspace }}/.cache/sentence-transformers
      CHROMA_PERSIST_DIR: ${{ github.workspace }}/.cache/chroma
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Cache ML model downloads
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.HF_HOME }}
            ${{ env.SENTENCE_TRANSFORMERS_HOME }}
          key: ml-cache-${{ runner.os }}-py3.12-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ml-cache-${{ runner.os }}-py3.12-

      - name: Cache pytest
        uses: actions/cache@v5
        with:
          path: backend/.pytest_cache
          key: pytest-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            pytest-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app/ tests/

      - name: Format check
        run: ruff format --check app/ tests/

      - name: Type check
        run: mypy app/ --ignore-missing-imports

      - name: Generate CI encryption key
        run: echo "MASTER_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Unit tests (with coverage)
        # --cov-fail-under=0 disables per-step enforcement: the 72% floor is a
        # property of the COMBINED unit+integration run, not of unit-only
        # (~71%). The single authoritative gate is the "Coverage gate" step
        # below; this step only collects coverage.
        run: |
          pytest tests/unit/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage-unit.xml \
            --cov-context=test \
            --cov-fail-under=0
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          MASTER_ENCRYPTION_KEY: ${{ env.MASTER_ENCRYPTION_KEY }}

      - name: Integration tests (with coverage append)
        run: |
          pytest tests/integration/ \
            --cov=app \
            --cov-append \
            --cov-report=term-missing \
            --cov-report=xml:coverage-combined.xml \
            --cov-fail-under=0
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          MASTER_ENCRYPTION_KEY: ${{ env.MASTER_ENCRYPTION_KEY }}

      - name: Retrieval eval gate (golden-set / RAGAS-style metrics)
        # Phase 3 regression gate: runs the deterministic golden-set harness
        # (app.eval) so a retrieval-quality regression fails CI. LLM-free and
        # network-free.
        #
        # `test_retrieval_eval.py` validates the golden set, the metric math, and
        # that an ORACLE retriever clears the thresholds — which proves the
        # harness works and says nothing about the product's retrieval. That was
        # always what this step claimed; the gap was that nobody wired the real
        # one, which is why both retrieval defects of 2026-09 passed CI green.
        #
        # Ш1 added `tests/unit/eval/test_real_retriever_eval.py`: the production
        # `HybridRetriever` with a REAL BM25 leg over a fixture corpus and a stub
        # dense leg, so RRF, `min_score`, `max_rank` and the degradation labels
        # are the shipped ones. Verified by planting a defect — killing the real
        # BM25 leg turns the golden-set assertion red, which the first version of
        # the fixture did NOT do because the stub was strong enough to carry it.
        #
        # The embedder itself is not covered here: that is `-m slow_eval`, opt-in,
        # because the model is a ~90 MB cold download in CI. The RUN is 4.5 s
        # measured locally, so a cached model would make this affordable — worth
        # revisiting rather than assuming it is expensive forever.
        run: |
          pytest tests/unit/test_retrieval_eval.py tests/unit/test_reranker.py \
                 tests/unit/eval/test_real_retriever_eval.py -q
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          MASTER_ENCRYPTION_KEY: ${{ env.MASTER_ENCRYPTION_KEY }}

      - name: Coverage gate (combined unit + integration)
        # Authoritative coverage gate. The threshold here and `fail_under` in
        # pyproject.toml must agree — `test_coverage_gate_is_stated_once.py` fails
        # when they drift, because the value lives in more than one file and a
        # number in two places is a number that disagrees with itself eventually.
        #
        # Runs on the COMBINED unit+integration data (82% as of 2026-08-26); the
        # per-step pytest runs above pass --cov-fail-under=0 so a partial run never
        # trips the gate early.
        run: |
          python -m coverage report --fail-under=80

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage-combined.xml
          retention-days: 7

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: frontend/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.[jt]s', 'frontend/**/*.[jt]sx') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
            next-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Seven high-severity advisories accumulated unnoticed and were cleared on
      # 2026-08-25 (five by `npm audit fix`, postcss by a scoped override — next 15.5
      # pins it to exactly 8.4.31). Nothing had been comparing the tree against the
      # advisory database, so the count only moved upward.
      #
      # This gate is blocking on purpose. When an advisory lands that has no fix, the
      # answer is to record the decision — the way `scripts/config_drift.py` records a
      # deliberate divergence — not to soften the gate, because a gate that yields to
      # the first inconvenient advisory protects nothing after that.
      #
      # 2026-09-04: the gate went red on `main`'s successor with **no advisory
      # involved**. `npm audit` exits 1 on a TRANSPORT failure too, so a
      # registry outage is indistinguishable from a finding:
      #
      #   npm warn audit 503 Service Unavailable - POST …/security/audits/quick
      #   npm error audit endpoint returned an error
      #   Process completed with exit code 1
      #
      # The `npm ci` step in the same job had reported "1 moderate severity
      # vulnerability" ninety seconds earlier, so the data existed — the
      # dedicated call hit a blip. A red build then reads as "we introduced a
      # vulnerability", which is the worst possible misreading of a gate.
      #
      # Retried three times with backoff, so a short outage never reaches a
      # human. It still FAILS if the endpoint stays down, and the message says
      # the gate could not be evaluated rather than claiming a finding. It does
      # not pass on an unevaluated check: "could not run" reported as a pass is
      # the substitution this whole file exists to refuse.
      - name: Audit dependencies
        run: |
          for attempt in 1 2 3; do
            if out=$(npm audit --audit-level=high 2>&1); then
              echo "$out"
              exit 0
            fi
            if grep -qE "audit endpoint returned an error|Service Unavailable|ENOTFOUND|ETIMEDOUT|socket hang up" <<< "$out"; then
              echo "::warning::npm audit endpoint unreachable (attempt $attempt/3) — retrying"
              sleep $((attempt * 20))
              continue
            fi
            # A real finding: print it and fail.
            echo "$out"
            exit 1
          done
          echo "::error::npm audit could NOT BE EVALUATED — the registry audit endpoint was unreachable after 3 attempts. This is not a vulnerability report; it is an unrun check. Re-run the job."
          exit 1

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --max-warnings=0

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api"
