name: Deploy site to Heroku

# Site only, and only by hand (operator, 2026-10-11). The hosted product was switched
# off: `checkmydata-api` runs no dynos and holds no database, so this workflow builds
# and releases the marketing site and nothing else. It used to fire on every green CI
# run on `main`; a merge no longer deploys — press "Run workflow" when the site should
# change. The backend half (images, release phase, worker check) is in git history at
# the commit before this one, for a relaunch.
on:
  workflow_dispatch:

concurrency:
  group: heroku-deploy
  cancel-in-progress: false

env:
  HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
  FRONTEND_APP: ${{ vars.FRONTEND_APP || 'checkmydata-web' }}
  FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://checkmydata.ai' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only what is on `main` ships, whichever branch the button was pressed on.
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v5

      - name: Login to Heroku Container Registry
        run: echo "$HEROKU_API_KEY" | docker login -u _ --password-stdin registry.heroku.com

      - name: Build site image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }} \
            --build-arg NEXT_PUBLIC_SENTRY_ENVIRONMENT=production \
            -t registry.heroku.com/${{ env.FRONTEND_APP }}/web \
            -f Dockerfile.frontend .

      - name: Push site image
        run: docker push registry.heroku.com/${{ env.FRONTEND_APP }}/web

      - name: Note the release version before deploying
        # `Range:` because the releases collection is paginated in ascending order; without
        # it the newest version is never read and the check below waits on nothing.
        run: |
          set -euo pipefail
          BEFORE_VERSION=$(curl --fail-with-body -sS \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Range: version ..; order=desc, max=1" \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
            https://api.heroku.com/apps/${{ env.FRONTEND_APP }}/releases | jq '.[0].version')
          echo "BEFORE_VERSION=$BEFORE_VERSION" >> "$GITHUB_ENV"
          echo "Site is at release v$BEFORE_VERSION before this deploy"

      - name: Release site
        run: |
          set -euo pipefail
          IMAGE_ID=$(docker inspect --format='{{.Id}}' registry.heroku.com/${{ env.FRONTEND_APP }}/web)
          curl --fail-with-body -sS -X PATCH https://api.heroku.com/apps/${{ env.FRONTEND_APP }}/formation \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
            -d '{"updates":[{"type":"web","docker_image":"'"$IMAGE_ID"'"}]}'

      - name: Verify the release actually happened
        # The platform, not the public URL: when a release fails, the OLD one still answers 200.
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            LATEST=$(curl --fail-with-body -sS \
              -H "Accept: application/vnd.heroku+json; version=3" \
              -H "Range: version ..; order=desc, max=1" \
              -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
              https://api.heroku.com/apps/${{ env.FRONTEND_APP }}/releases)
            VERSION=$(jq '.[0].version' <<<"$LATEST")
            STATUS=$(jq -r '.[0].status' <<<"$LATEST")
            if [ "$VERSION" -gt "$BEFORE_VERSION" ] && [ "$STATUS" = "succeeded" ]; then
              echo "Site released: v$BEFORE_VERSION -> v$VERSION"
              exit 0
            elif [ "$VERSION" -gt "$BEFORE_VERSION" ] && [ "$STATUS" = "failed" ]; then
              echo "Release v$VERSION FAILED"
              exit 1
            fi
            echo "Attempt $i: v$VERSION is $STATUS, waiting..."
            sleep 15
          done
          echo "No successful release appeared (still at v$BEFORE_VERSION)"
          exit 1

      - name: Verify the site and the waitlist endpoint
        # An empty sign-up must be refused with 422: that proves the route is deployed and
        # validating, without mailing the team inbox on every deploy.
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            sleep 20
            HOME_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.FRONTEND_URL }}")
            WAITLIST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Content-Type: application/json" -d '{}' "${{ env.FRONTEND_URL }}/api/waitlist")
            if [ "$HOME_STATUS" = "200" ] && [ "$WAITLIST_STATUS" = "422" ]; then
              echo "Site 200, waitlist validates (422 on an empty body)"
              exit 0
            fi
            echo "Attempt $i: home $HOME_STATUS, waitlist $WAITLIST_STATUS"
          done
          exit 1
