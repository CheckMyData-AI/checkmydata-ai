name: Deploy to Heroku

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: heroku-deploy
  # TEST-17: QUEUE, never cancel. A cancellation can land between the backend release and
  # the frontend release, leaving the two on different commits until the next run's
  # ten-minute build finishes — or between a release and its verification, marking an
  # unverified production release merely "cancelled". Waiting costs one build; the other
  # costs an incoherent production nobody was told about.
  cancel-in-progress: false

env:
  HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
  BACKEND_APP: ${{ vars.BACKEND_APP || 'checkmydata-api' }}
  FRONTEND_APP: ${{ vars.FRONTEND_APP || 'checkmydata-web' }}
  BACKEND_API_URL: ${{ vars.BACKEND_API_URL || 'https://api.checkmydata.ai/api' }}
  BACKEND_WS_URL: ${{ vars.BACKEND_WS_URL || 'wss://api.checkmydata.ai/api/chat/ws' }}
  FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://checkmydata.ai' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `event == 'push'` is the half that is not obvious. `branches: [main]` above
    # matches the HEAD branch of the CI run, and since CI now runs on every pull
    # request, a PR opened *from* `main` would produce a run that satisfies it.
    # Deploy follows a merge, never a proposal.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Heroku Container Registry
        run: echo "$HEROKU_API_KEY" | docker login -u _ --password-stdin registry.heroku.com

      - name: Build backend image
        # GIT_SHA is what Sentry's `release` becomes. It has to be the commit the image
        # was built from, and it has to match the release the commits are attached to —
        # `workflow_run.head_sha` is the same value this job checked out above.
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg GIT_SHA=${{ github.event.workflow_run.head_sha }} \
            -t registry.heroku.com/${{ env.BACKEND_APP }}/web \
            -f Dockerfile.backend .

      - name: Build worker image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg BASE_IMAGE=registry.heroku.com/${{ env.BACKEND_APP }}/web \
            --build-arg GIT_SHA=${{ github.event.workflow_run.head_sha }} \
            -t registry.heroku.com/${{ env.BACKEND_APP }}/worker \
            -f Dockerfile.worker .

      - name: Build release-phase image
        # Same image, one different CMD — the shape Dockerfile.worker already uses. This is
        # what runs `alembic upgrade head` BEFORE the new release goes live (TEST-15).
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg BASE_IMAGE=registry.heroku.com/${{ env.BACKEND_APP }}/web \
            -t registry.heroku.com/${{ env.BACKEND_APP }}/release \
            -f Dockerfile.release .

      - name: Build frontend image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_URL=${{ env.BACKEND_API_URL }} \
            --build-arg NEXT_PUBLIC_WS_URL=${{ env.BACKEND_WS_URL }} \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }} \
            --build-arg NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }} \
            --build-arg NEXT_PUBLIC_SENTRY_ENVIRONMENT=production \
            -t registry.heroku.com/${{ env.FRONTEND_APP }}/web \
            -f Dockerfile.frontend .

      - name: Push backend image
        run: docker push registry.heroku.com/${{ env.BACKEND_APP }}/web

      - name: Push worker image
        run: docker push registry.heroku.com/${{ env.BACKEND_APP }}/worker

      - name: Push release-phase image
        run: docker push registry.heroku.com/${{ env.BACKEND_APP }}/release

      - name: Push frontend image
        run: docker push registry.heroku.com/${{ env.FRONTEND_APP }}/web

      - name: Note the release version before deploying
        # The whole verification rests on this: "a release exists and is healthy" is not the
        # same statement as "MY release happened", and only a before/after comparison can
        # tell them apart (TEST-01).
        run: |
          set -euo pipefail
          # `Range:` is load-bearing, not tidiness. The releases collection is paginated
          # and returned in ASCENDING order, so a plain GET yields the OLDEST 200 releases
          # and `[.[].version] | max` reads 200 on an app that is at 375 — the version then
          # never appears to move and the verification below waits out its attempts on a
          # release that already succeeded. Measured on production 2026-09-11, by this step
          # failing its own first run.
          BEFORE_VERSION=$(curl --fail-with-body -sS \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Range: version ..; order=desc, max=1" \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
            https://api.heroku.com/apps/${{ env.BACKEND_APP }}/releases | jq '.[0].version')
          echo "BEFORE_VERSION=$BEFORE_VERSION" >> "$GITHUB_ENV"
          echo "Backend is at release v$BEFORE_VERSION before this deploy"

      - name: Release backend
        run: |
          set -euo pipefail
          WEB_IMAGE_ID=$(docker inspect --format='{{.Id}}' registry.heroku.com/${{ env.BACKEND_APP }}/web)
          WORKER_IMAGE_ID=$(docker inspect --format='{{.Id}}' registry.heroku.com/${{ env.BACKEND_APP }}/worker)
          RELEASE_IMAGE_ID=$(docker inspect --format='{{.Id}}' registry.heroku.com/${{ env.BACKEND_APP }}/release)
          # `--fail-with-body`: without it curl exits 0 on 401/403/404/422, so a rotated
          # API key or a refused image id was a PASSING step and production silently
          # stopped receiving deploys (TEST-01). `-w`/`-o` are not enough on their own —
          # the exit code is what the runner reads.
          curl --fail-with-body -sS -X PATCH https://api.heroku.com/apps/${{ env.BACKEND_APP }}/formation \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
            -d '{"updates":[{"type":"web","docker_image":"'"$WEB_IMAGE_ID"'"},{"type":"worker","docker_image":"'"$WORKER_IMAGE_ID"'"},{"type":"release","docker_image":"'"$RELEASE_IMAGE_ID"'"}]}'

      - name: Verify the backend release actually happened
        # Reads the platform, not a public URL. The health endpoint answers from whatever is
        # live, so when the release fails it is the OLD release that returns 200 — which is
        # how a broken deploy reported itself healthy. A `failed` status here also covers
        # the release phase: a migration that does not apply aborts the release.
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            LATEST=$(curl --fail-with-body -sS \
              -H "Accept: application/vnd.heroku+json; version=3" \
              -H "Range: version ..; order=desc, max=1" \
              -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
              https://api.heroku.com/apps/${{ env.BACKEND_APP }}/releases)
            VERSION=$(jq '.[0].version' <<<"$LATEST")
            STATUS=$(jq -r '.[0].status' <<<"$LATEST")
            if [ "$VERSION" -le "$BEFORE_VERSION" ]; then
              echo "Attempt $i: still at v$VERSION, waiting for a new release..."
            elif [ "$STATUS" = "succeeded" ]; then
              echo "Backend released: v$BEFORE_VERSION -> v$VERSION (status $STATUS)"
              echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
              exit 0
            elif [ "$STATUS" = "failed" ]; then
              echo "Release v$VERSION FAILED — the release phase (alembic upgrade head) did not succeed"
              exit 1
            else
              echo "Attempt $i: v$VERSION is $STATUS..."
            fi
            sleep 15
          done
          echo "No successful release appeared after this deploy (still at v$BEFORE_VERSION)"
          exit 1

      - name: Verify the worker is running the new release
        # TEST-16: both health checks speak HTTP and the worker serves none, so a worker
        # image that dies on import deployed green — on the process type this repo's own
        # incident history names as the recurring failure surface.
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            DYNOS=$(curl --fail-with-body -sS \
              -H "Accept: application/vnd.heroku+json; version=3" \
              -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
              https://api.heroku.com/apps/${{ env.BACKEND_APP }}/dynos)
            UP=$(jq -r --argjson v "$RELEASE_VERSION" \
              '[.[] | select(.type == "worker" and .state == "up" and .release.version == $v)] | length' \
              <<<"$DYNOS")
            if [ "$UP" -ge 1 ]; then
              echo "Worker is up on release v$RELEASE_VERSION"
              exit 0
            fi
            echo "Attempt $i: no worker dyno up on v$RELEASE_VERSION yet..."
            sleep 15
          done
          echo "The worker never came up on release v$RELEASE_VERSION"
          exit 1

      - name: Release frontend
        run: |
          set -euo pipefail
          IMAGE_ID=$(docker inspect --format='{{.Id}}' registry.heroku.com/${{ env.FRONTEND_APP }}/web)
          curl --fail-with-body -sS -X PATCH https://api.heroku.com/apps/${{ env.FRONTEND_APP }}/formation \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
            -d '{"updates":[{"type":"web","docker_image":"'"$IMAGE_ID"'"}]}'

      - name: Verify backend health
        run: |
          for i in 1 2 3 4 5; do
            sleep 30
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.BACKEND_API_URL }}/health)
            if [ "$STATUS" = "200" ]; then
              echo "Backend is healthy (HTTP $STATUS) on attempt $i"
              exit 0
            fi
            echo "Attempt $i: backend returned $STATUS, retrying..."
          done
          echo "Backend health check failed after 5 attempts (last status: $STATUS)"
          exit 1

      - name: Verify frontend health
        run: |
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.FRONTEND_URL }})
          if [ "$STATUS" != "200" ]; then
            echo "Frontend health check failed with status $STATUS"
            exit 1
          fi
          echo "Frontend is healthy (HTTP $STATUS)"
