name: Deploy site to Cloudflare

# Site only, and only by hand (operator, 2026-10-11). The hosted product is off, and
# since 2026-10-12 checkmydata.ai is a static export on Cloudflare Workers — no server,
# no monthly cost. Press "Run workflow" when the site should change; a merge does not
# deploy. The Heroku pipeline this replaced is in git history, for a relaunch.
#
# Credentials, each narrow (issued per project, never an account admin key):
#   secrets.CLOUDFLARE_WORKERS_TOKEN — Workers Scripts Write on the account
#   secrets.CLOUDFLARE_ROUTES_TOKEN  — Workers Routes Write on the checkmydata.ai zone
#   vars.CLOUDFLARE_ACCOUNT_ID
# RESEND_API_KEY is a Worker secret set once with `wrangler secret put`, not here.
on:
  workflow_dispatch:

concurrency:
  group: site-deploy
  cancel-in-progress: false

env:
  SITE_URL: https://checkmydata.ai

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only what is on `main` ships, whichever branch the button was pressed on.
    if: ${{ github.ref == 'refs/heads/main' }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the static site
        run: npm run build:site
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: production

      - name: Deploy the Worker and its assets
        # wrangler exits non-zero on any refused upload, so a failed deploy fails here.
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Put the Worker in front of checkmydata.ai
        run: node scripts/attach-site-route.mjs
        env:
          CLOUDFLARE_ROUTES_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_TOKEN }}

      - name: Verify the live site is the Worker
        # Three readings, each one only the Worker gives: its JSON 404 for an unknown
        # /api path (an older origin answers with an HTML page), the waitlist refusing an
        # EMPTY body with 422 (proves the endpoint without mailing the inbox), and a
        # retired product route redirecting to the waitlist.
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            HOME_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/")
            PROBE=$(curl -s "$SITE_URL/api/deploy-probe" || true)
            WAITLIST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Content-Type: application/json" -d '{}' "$SITE_URL/api/waitlist")
            LOGIN=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" "$SITE_URL/login")
            if [ "$HOME_STATUS" = "200" ] && [ "$PROBE" = '{"ok":false,"error":"Not found."}' ] \
              && [ "$WAITLIST_STATUS" = "422" ] && [ "$LOGIN" = "307 $SITE_URL/#waitlist" ]; then
              echo "Live: home 200, Worker probe, waitlist 422, /login → /#waitlist"
              exit 0
            fi
            echo "Attempt $i: home $HOME_STATUS, probe '$PROBE', waitlist $WAITLIST_STATUS, login '$LOGIN'"
            sleep 15
          done
          exit 1
